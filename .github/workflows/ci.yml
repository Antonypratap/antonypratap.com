name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # BLOCKED_TERMS (repository secret, optional): names that must never appear on the site,
      # such as a confidential client's real name.
      - run: npm run verify
        env:
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
      - run: npm audit --omit=dev --audit-level=high
